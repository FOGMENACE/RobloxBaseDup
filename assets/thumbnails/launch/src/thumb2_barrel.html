<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .bg { background-image: url('barrel.jpg'); background-position: 60% 55%; transform: scale(1.18); filter: saturate(1.35) contrast(1.1) brightness(1.05); }
  .glow { position: absolute; left: 22vw; top: 22vh; width: 66vw; height: 66vh; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,150,0.55), rgba(255,180,40,0) 65%); mix-blend-mode: screen; }
  .t1 { font-size: 12vh; left: 3vw; top: 5vh; transform: rotate(-4deg); }
  .t2 { font-size: 17vh; left: 3vw; top: 17vh; transform: rotate(-4deg); }
  .b1 { right: 3vw; top: 6vh; width: 34vw; height: 17vh; font-size: 9vh; white-space: nowrap; background: linear-gradient(180deg, #ff5ad1, #8a3cff);
        transform: rotate(7deg); }
  .b2 { right: 6vw; bottom: 8vh; width: 30vw; height: 15vh; font-size: 9vh; white-space: nowrap; background: linear-gradient(180deg, #ffe066, #ff8a00);
        transform: rotate(-5deg); color:#fff; }
</style></head>
<body><div class="stage">
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="vignette"></div>
  <div class="title t1"><span class="gold">THE RAINBOW</span></div>
  <div class="title t2">OIL BARREL</div>
  <div class="badge b1">FASTEST BALL!</div>
  <div class="badge b2">SUPER RARE!</div>
  <div class="spark" style="left:33vw; top:70vh"></div>
  <div class="spark" style="left:66vw; top:22vh; transform:scale(1.3)"></div>
  <div class="spark" style="left:52vw; top:84vh; transform:scale(0.8)"></div>
</div></body></html>
