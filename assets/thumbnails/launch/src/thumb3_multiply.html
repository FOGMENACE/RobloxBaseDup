<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .bg { background-image: url('rolling.jpg'); background-position: 35% 50%; transform: scale(1.12); filter: saturate(1.3) contrast(1.1); }
  .wash { position: absolute; inset: 0; background: linear-gradient(110deg, rgba(120,40,255,0.0) 40%, rgba(120,40,255,0.55) 100%); }
  .big { font-size: 34vh; right: 3vw; top: 14vh; transform: rotate(-9deg); white-space: nowrap; }
  .xp { font-size: 0.42em; margin-left: 0.08em; color: #7dff8c; }
  .corner { position: absolute; left: 0; top: 0; width: 70vw; height: 46vh; background: radial-gradient(ellipse at 0% 0%, rgba(40,14,90,0.92) 0%, rgba(40,14,90,0.6) 45%, rgba(40,14,90,0) 75%); }
  .sub { font-size: 9.5vh; right: 5vw; top: 64vh; transform: rotate(-6deg); text-align: right; }
  .logo { font-size: 9.5vh; left: 3vw; top: 4vh; transform: rotate(-4deg); }
  .ring { position: absolute; right: 8vw; top: 12vh; width: 44vw; height: 60vh; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,120,0.65), rgba(255,170,30,0) 62%); mix-blend-mode: screen; }
</style></head>
<body><div class="stage">
  <div class="bg"></div>
  <div class="wash"></div>
  <div class="corner"></div>
  <div class="ring"></div>
  <div class="vignette"></div>
  <div class="streak" style="left:-4vw; top:60vh; width:38vw; transform:rotate(-14deg)"></div>
  <div class="streak" style="left:-6vw; top:70vh; width:30vw; transform:rotate(-10deg)"></div>
  <div class="streak" style="left:-5vw; top:79vh; width:26vw; transform:rotate(-7deg)"></div>
  <div class="title big"><span class="gold">x1000</span><span class="xp">XP</span></div>
  <div class="title sub">LEVEL UP<br>FAST!</div>
  <div class="title logo"><span class="gold">STRIKE OIL!</span></div>
  <div class="spark" style="right:9vw; top:12vh; transform:scale(1.4)"></div>
  <div class="spark" style="right:44vw; top:28vh"></div>
</div></body></html>
