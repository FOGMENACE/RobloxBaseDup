<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* left: the plain starter ball, cold and flat */
  .left { position: absolute; left: 0; top: 0; width: 52vw; height: 100vh; overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); }
  .left .img { position: absolute; inset: 0; background: url('split.png') 30% 70% / 175% no-repeat;
    filter: saturate(0.35) brightness(0.8) contrast(1.05); }
  .left .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,60,120,0.35), rgba(10,20,60,0.55)); }

  /* right: the rainbow barrel, glowing gold */
  .right { position: absolute; right: 0; top: 0; width: 58vw; height: 100vh; overflow: hidden;
    clip-path: polygon(17% 0, 100% 0, 100% 100%, 0 100%); }
  .right .img { position: absolute; inset: 0; background: url('barrel.jpg') 52% 55% / 150% no-repeat;
    filter: saturate(1.45) contrast(1.12) brightness(1.08); }
  .right .glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 58% 52%, rgba(255,226,110,0.55), rgba(255,170,30,0) 58%); mix-blend-mode: screen; }
  .right .rays { position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg at 60% 52%, rgba(255,230,140,0.16) 0deg 8deg, rgba(255,230,140,0) 8deg 18deg); mix-blend-mode: screen; }

  /* the split line: a bright lightning seam */
  .seam { position: absolute; left: 44.5vw; top: -5vh; width: 1.4vw; height: 110vh; transform: rotate(7.2deg);
    background: linear-gradient(180deg, #fff6c8, #ffd23a 50%, #fff6c8); box-shadow: 0 0 4vh 1.6vh rgba(255,214,70,0.85); }

  .tag { position: absolute; padding: 1.2vh 3.2vw; border-radius: 2.6vh; border: 0.9vh solid #1b1236;
    font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 10vh; color: #fff;
    -webkit-text-stroke: 0.06em #1b1236; paint-order: stroke fill;
    box-shadow: 0 1.1vh 0 #1b1236, 0 2vh 4vh rgba(0,0,0,0.5); }
  .noob { left: 4vw; top: 6vh; background: linear-gradient(180deg, #8a93a8, #4c5468); transform: rotate(-5deg); }
  .pro { right: 4vw; top: 6vh; background: linear-gradient(180deg, #ffe066, #ff8a00); transform: rotate(5deg); }

  .n1 { font-size: 14vh; left: 6vw; bottom: 9vh; transform: rotate(-4deg); }
  .n2 { font-size: 17vh; right: 3vw; bottom: 7vh; transform: rotate(-5deg); white-space: nowrap; }
  .unit { font-size: 0.45em; }

  .arrow { position: absolute; left: 40vw; top: 38vh; font-size: 26vh; font-family: 'Lilita One', 'Arial Black', sans-serif;
    color: #ffd23a; -webkit-text-stroke: 0.07em #1b1236; paint-order: stroke fill;
    filter: drop-shadow(0 0.04em 0 #1b1236) drop-shadow(0 0 3vh rgba(255,214,70,0.9)); }
</style></head>
<body><div class="stage">
  <div class="left"><div class="img"></div><div class="tint"></div></div>
  <div class="right"><div class="img"></div><div class="rays"></div><div class="glow"></div></div>
  <div class="vignette"></div>
  <div class="seam"></div>
  <div class="tag noob">NOOB</div>
  <div class="tag pro">PRO</div>
  <div class="title n1"><span class="red">+6</span><span class="unit"> OIL</span></div>
  <div class="title n2"><span class="gold">+1,000,000</span><span class="unit"> OIL</span></div>
  <div class="arrow">&#x279C;</div>
  <div class="spark" style="right:30vw; top:24vh; transform:scale(1.5)"></div>
  <div class="spark" style="right:9vw; top:42vh"></div>
  <div class="spark" style="right:44vw; top:72vh; transform:scale(0.8)"></div>
</div></body></html>
