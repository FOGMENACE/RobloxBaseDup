<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { background: #2a1466; }
  .sky { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #b46bff 0%, #6a2cff 45%, #2a0f6e 100%); }
  .rays { position: absolute; inset: -20%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0.10) 0deg 10deg, rgba(255,255,255,0) 10deg 22deg); }
  .barrel { position: absolute; left: -12%; top: 6%; width: 124%; height: 84%;
    background-image: url('barrel.jpg'); background-size: 170%; background-position: 44% 52%;
    -webkit-mask-image: radial-gradient(ellipse 46% 48% at 50% 52%, #000 70%, transparent 100%);
            mask-image: radial-gradient(ellipse 46% 48% at 50% 52%, #000 70%, transparent 100%);
    filter: saturate(1.45) contrast(1.12) brightness(1.06); transform: rotate(-12deg); }
  .x { font-size: 30vh; right: 4vw; bottom: 3vh; transform: rotate(-10deg); }
  .frame { position: absolute; inset: 0; border: 3.2vh solid #ffd23a; border-radius: 9vh; box-shadow: inset 0 0 0 1.6vh #1b1236; }
</style></head>
<body><div class="stage">
  <div class="sky"></div>
  <div class="rays"></div>
  <div class="barrel"></div>
  <div class="title x"><span class="gold">x1000</span></div>
  <div class="spark" style="left:10vw; top:12vh; width:12vh; height:12vh"></div>
  <div class="spark" style="left:78vw; top:18vh; width:9vh; height:9vh"></div>
  <div class="frame"></div>
</div></body></html>
