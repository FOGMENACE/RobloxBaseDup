<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { background: #2a1466; }
  .sky { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #ff9de0 0%, #a046ff 38%, #3a138c 100%); }
  .rays { position: absolute; inset: -25%; background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(255,255,255,0.13) 0deg 9deg, rgba(255,255,255,0) 9deg 20deg); }
  /* the bowler and his ball, cropped away from the old title in the corner */
  .bowler { position: absolute; inset: 0; background: url('bowler.png') 62% 58% / 165% no-repeat;
    -webkit-mask-image: radial-gradient(ellipse 66% 66% at 50% 50%, #000 70%, transparent 100%);
            mask-image: radial-gradient(ellipse 66% 66% at 50% 50%, #000 70%, transparent 100%);
    filter: saturate(1.3) contrast(1.08) brightness(1.06); }
  .frame { position: absolute; inset: 0; border: 3.2vh solid #ffd23a; border-radius: 9vh; box-shadow: inset 0 0 0 1.6vh #1b1236; }
</style></head>
<body><div class="stage">
  <div class="sky"></div>
  <div class="rays"></div>
  <div class="bowler"></div>
  <div class="spark" style="left:12vw; top:14vh; width:11vh; height:11vh"></div>
  <div class="spark" style="left:80vw; top:22vh; width:8vh; height:8vh"></div>
  <div class="frame"></div>
</div></body></html>
